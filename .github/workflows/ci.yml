name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ruff black mypy

      - name: Check formatting with Black
        run: |
          black --check --diff .

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with MyPy
        run: |
          mypy app --ignore-missing-imports

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Next.js
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install bandit safety pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r app -f txt --exclude ./venv,./.venv,./build,./dist

      - name: Run Safety dependency check
        run: |
          safety check --full-report

      - name: Run pip-audit (fail on vulnerabilities)
        run: |
          pip-audit -r requirements.txt

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/behavior-auth:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/behavior-auth:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/behavior-auth:latest
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/behavior-auth:latest

  ci:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker]
    steps:
      - name: Success message
        run: |
          echo "All CI checks passed successfully!"