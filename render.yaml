services:
  - type: web
    name: bba-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - run:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://<YOUR_VERCEL_FRONTEND_URL>"
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: bba-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bba-redis
          type: redis
          property: connectionString

databases:
  - name: bba-db
    plan: free
    databaseName: bba
    user: bba_user
