services:
  - type: web
    name: bba-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - run:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: FLASK_ENV
        value: "production"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: BACKUP_FERNET
        generateValue: true
      - key: TXN_SIGNING_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: bba-redis
          type: redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bba-redis
          type: redis
          property: connectionString
      - key: DATABASE_PATH
        value: "database/auth_system.db"
    disk:
      name: bba-data
      mountPath: /opt/render/project/src/database
      sizeGB: 1

databases:
  - name: bba-db
    plan: free
    databaseName: bba
    user: bba_user
