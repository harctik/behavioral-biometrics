services:
  - type: web
    name: bba-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - run:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: FLASK_ENV
        value: "production"
      - key: SQLALCHEMY_DATABASE_URI
        sync: false  # Set in Render dashboard (Supabase PostgreSQL URI)
      - key: JWT_SECRET_KEY
        sync: false  # Set in Render dashboard
      - key: SECRET_KEY
        sync: false  # Set in Render dashboard
      - key: BACKUP_FERNET
        sync: false  # Set in Render dashboard
      - key: TXN_SIGNING_KEY
        sync: false  # Set in Render dashboard
      - key: FRONTEND_URL
        value: "https://aetherauth.vercel.app"
      - key: CORS_ORIGINS
        value: "https://aetherauth.vercel.app"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"
      - key: REDIS_URL
        value: ""
      - key: DATABASE_PATH
        value: ""
      - key: MAIL_BACKEND
        value: "resend"
      - key: RESEND_API_KEY
        sync: false  # Set in Render dashboard
      - key: MAIL_DEFAULT_SENDER
        value: "onboarding@resend.dev"
      - key: DEBUG
        value: "false"
      - key: CSRF_ENABLED
        value: "false"
