<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #64748B; text-anchor: middle; }
      .system-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 16px; fill: #1E293B; letter-spacing: 1.5px; }
      .actor-name { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; fill: #1E293B; text-anchor: middle; }
      .usecase-text { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 12px; fill: #1E293B; text-anchor: middle; }
      .usecase-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 12px; fill: #0F172A; text-anchor: middle; }
      .legend-text { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 11px; fill: #475569; }
      
      /* Styles for shapes */
      .bg-rect { fill: #F8FAFC; }
      .system-rect { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; stroke-dasharray: 4 4; rx: 16; }
      .usecase-ellipse { fill: url(#uc-grad); stroke: #0284C7; stroke-width: 1.5; filter: drop-shadow(0px 2px 4px rgba(2, 132, 199, 0.15)); transition: all 0.3s ease; }
      .usecase-ellipse:hover { fill: url(#uc-grad-hover); stroke: #0369A1; }
      
      /* Connectors */
      .connector { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; }
      .connector-arrow { fill: #475569; }
    ]]></style>

    <!-- Gradients -->
    <linearGradient id="uc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="uc-grad-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    
    <!-- Actor Gradients -->
    <linearGradient id="student-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="faculty-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="admin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <rect width="1120" height="792" class="bg-rect" />
  <g opacity="0.2">
    <path d="M 0,40 L 1120,40 M 0,80 L 1120,80 M 0,120 L 1120,120 M 0,160 L 1120,160 M 0,200 L 1120,200 M 0,240 L 1120,240 M 0,280 L 1120,280 M 0,320 L 1120,320 M 0,360 L 1120,360 M 0,400 L 1120,400 M 0,440 L 1120,440 M 0,480 L 1120,480 M 0,520 L 1120,520 M 0,560 L 1120,560 M 0,600 L 1120,600 M 0,640 L 1120,640 M 0,680 L 1120,680 M 0,720 L 1120,720 M 0,760 L 1120,760" stroke="#CBD5E1" stroke-width="0.5" />
    <path d="M 40,0 L 40,792 M 80,0 L 80,792 M 120,0 L 120,792 M 160,0 L 160,792 M 200,0 L 200,792 M 240,0 L 240,792 M 280,0 L 280,792 M 320,0 L 320,792 M 360,0 L 360,792 M 40,0 L 40,792 M 440,0 L 440,792 M 480,0 L 480,792 M 520,0 L 520,792 M 560,0 L 560,792 M 600,0 L 600,792 M 640,0 L 640,792 M 680,0 L 680,792 M 720,0 L 720,792 M 760,0 L 760,792 M 800,0 L 800,792 M 840,0 L 840,792 M 880,0 L 880,792 M 920,0 L 920,792 M 960,0 L 960,792 M 1000,0 L 1000,792 M 1040,0 L 1040,792 M 1080,0 L 1080,792" stroke="#CBD5E1" stroke-width="0.5" />
  </g>

  <!-- Title block -->
  <text x="560" y="50" class="title">FIGURE 3.1: USE-CASE DIAGRAM</text>
  <text x="560" y="72" class="subtitle">Studvisor Academic &amp; AI-Assisted Advising Platform - Primary Actors and Functional Boundary</text>

  <!-- System Boundary -->
  <rect x="220" y="100" width="680" height="630" class="system-rect" filter="url(#shadow)" />
  <text x="240" y="130" class="system-title">STUDVISOR PLATFORM BOUNDARY</text>

  <!-- ==================== ACTORS ==================== -->
  
  <!-- Student Actor (Left) -->
  <g id="actor-student" transform="translate(100, 380)">
    <!-- Stick Figure Graphic -->
    <circle cx="0" cy="-35" r="18" fill="url(#student-grad)" filter="url(#shadow)"/>
    <path d="M -8, -14 L 8, -14 L 14, 20 L 6, 20 L 0, -2 L -6, 20 L -14, 20 Z" fill="url(#student-grad)" filter="url(#shadow)"/>
    <text x="0" y="45" class="actor-name">Student</text>
    <text x="0" y="60" font-family="'Outfit', sans-serif" font-size="11px" fill="#D97706" font-weight="600" text-anchor="middle">PRIMARY USER</text>
  </g>

  <!-- Faculty Actor (Right Top) -->
  <g id="actor-faculty" transform="translate(1020, 240)">
    <circle cx="0" cy="-35" r="18" fill="url(#faculty-grad)" filter="url(#shadow)"/>
    <!-- Add a tiny academic cap detail -->
    <path d="M -22,-45 L 0,-53 L 22,-45 L 0,-37 Z M 10,-41 L 10,-30 C 10,-24 -10,-24 -10,-30 L -10,-41" fill="#1E293B" opacity="0.8" />
    <path d="M -8, -14 L 8, -14 L 14, 20 L 6, 20 L 0, -2 L -6, 20 L -14, 20 Z" fill="url(#faculty-grad)" filter="url(#shadow)"/>
    <text x="0" y="45" class="actor-name">Faculty Member / HOD</text>
    <text x="0" y="60" font-family="'Outfit', sans-serif" font-size="11px" fill="#2563EB" font-weight="600" text-anchor="middle">ACADEMIC AUDITOR</text>
  </g>

  <!-- Administrator Actor (Right Bottom) -->
  <g id="actor-admin" transform="translate(1020, 560)">
    <circle cx="0" cy="-35" r="18" fill="url(#admin-grad)" filter="url(#shadow)"/>
    <path d="M -8, -14 L 8, -14 L 14, 20 L 6, 20 L 0, -2 L -6, 20 L -14, 20 Z" fill="url(#admin-grad)" filter="url(#shadow)"/>
    <text x="0" y="45" class="actor-name">System Administrator</text>
    <text x="0" y="60" font-family="'Outfit', sans-serif" font-size="11px" fill="#DC2626" font-weight="600" text-anchor="middle">SYSTEM CONTROLLER</text>
  </g>


  <!-- ==================== USE CASES (STUDENT) ==================== -->
  
  <!-- UC1: View Academic Profile -->
  <g id="uc-view-profile" transform="translate(400, 160)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">View Academic Profile</text>
    <text x="0" y="12" class="usecase-text">Attendance, Marks, GPA &amp; Fees</text>
  </g>

  <!-- UC2: Interact with AI Tutor -->
  <g id="uc-ai-tutor" transform="translate(400, 270)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Interact with AI Tutor</text>
    <text x="0" y="12" class="usecase-text">Contextual RAG Chat &amp; Syllabus</text>
  </g>

  <!-- UC3: Monitor Performance Real-time -->
  <g id="uc-monitor-perf" transform="translate(400, 380)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Monitor Performance</text>
    <text x="0" y="12" class="usecase-text">Real-time Marks &amp; Subject Drilldown</text>
  </g>

  <!-- UC4: Participate in Campus Wall -->
  <g id="uc-campus-wall" transform="translate(400, 490)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Participate in Campus Wall</text>
    <text x="0" y="12" class="usecase-text">Anonymous Posts &amp; Gamified XP</text>
  </g>

  <!-- UC5: Submit Leave Applications -->
  <g id="uc-submit-leave" transform="translate(400, 600)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Submit Leave Request</text>
    <text x="0" y="12" class="usecase-text">Upload Medicals &amp; Track Status</text>
  </g>


  <!-- ==================== USE CASES (FACULTY & ADMIN) ==================== -->

  <!-- UC6: Manage Classroom Attendance -->
  <g id="uc-manage-attendance" transform="translate(720, 190)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Manage Class Attendance</text>
    <text x="0" y="12" class="usecase-text">24-Hour Amendment Enforcement</text>
  </g>

  <!-- UC7: Input & Update Internal Marks -->
  <g id="uc-manage-marks" transform="translate(720, 300)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Manage Internal Marks</text>
    <text x="0" y="12" class="usecase-text">Record Scores &amp; GPA Simulations</text>
  </g>

  <!-- UC8: View Student Risk Signals -->
  <g id="uc-view-risk" transform="translate(720, 410)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">View Predictive Risk Signals</text>
    <text x="0" y="12" class="usecase-text">Dropout, Failure &amp; Disengagement</text>
  </g>

  <!-- UC9: Generate Reports -->
  <g id="uc-gen-reports" transform="translate(720, 520)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Generate Class Reports</text>
    <text x="0" y="12" class="usecase-text">Cohort-level Analytics &amp; Trends</text>
  </g>

  <!-- UC10: Manage Master Data -->
  <g id="uc-manage-master" transform="translate(720, 630)">
    <ellipse cx="0" cy="0" rx="140" ry="30" class="usecase-ellipse" />
    <text x="0" y="-3" class="usecase-title">Manage Institutional Data</text>
    <text x="0" y="12" class="usecase-text">Courses, Users, &amp; Deployments</text>
  </g>


  <!-- ==================== CONNECTOR LINES ==================== -->
  
  <!-- Student Links (Left side) -->
  <g id="student-connectors">
    <!-- Student -> UC1 -->
    <path d="M 120,380 C 180,320 220,160 260,160" class="connector" />
    <!-- Student -> UC2 -->
    <path d="M 120,380 C 180,350 210,270 260,270" class="connector" />
    <!-- Student -> UC3 -->
    <path d="M 120,380 L 260,380" class="connector" />
    <!-- Student -> UC4 -->
    <path d="M 120,380 C 180,410 210,490 260,490" class="connector" />
    <!-- Student -> UC5 -->
    <path d="M 120,380 C 180,440 220,600 260,600" class="connector" />
  </g>

  <!-- Faculty Links (Right Top side) -->
  <g id="faculty-connectors">
    <!-- Faculty -> UC6 -->
    <path d="M 1000,240 C 940,210 900,190 860,190" class="connector" />
    <!-- Faculty -> UC7 -->
    <path d="M 1000,240 C 940,260 900,300 860,300" class="connector" />
    <!-- Faculty -> UC8 (View Risk Signals) -->
    <path d="M 1000,240 C 920,290 900,410 860,410" class="connector" />
    <!-- Faculty -> UC9 (Gen Reports) -->
    <path d="M 1000,240 C 910,320 900,520 860,520" class="connector" />
  </g>

  <!-- Admin Links (Right Bottom side) -->
  <g id="admin-connectors">
    <!-- Admin -> UC10 (Manage Master Data) -->
    <path d="M 1000,560 C 920,580 900,630 860,630" class="connector" />
    <!-- Admin -> UC9 (Campus Analytics - Gen Reports) -->
    <path d="M 1000,560 C 940,540 900,520 860,520" class="connector" />
    <!-- Admin -> UC8 (Configure AI Engine) -->
    <path d="M 1000,560 C 950,500 900,410 860,410" class="connector" />
  </g>

  <!-- Audit Log Link (Admin -> Audit Logs - UC10 boundary) -->
  <!-- Let's draw an indirect line indicating administrator oversight of audit trails -->
  <path d="M 1000,560 C 910,650 630,710 560,710 C 510,710 470,680 430,625" class="connector" stroke-dasharray="3 3" />
  
  <!-- ==================== LEGEND & METADATA ==================== -->
  <g transform="translate(40, 700)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8" />
    <circle cx="20" cy="18" r="8" fill="url(#student-grad)" />
    <text x="35" y="22" class="legend-text">Student Boundary Context</text>
    
    <circle cx="20" cy="42" r="8" fill="url(#faculty-grad)" />
    <text x="35" y="46" class="legend-text">Faculty / Admin Interactions</text>
    
    <ellipse cx="190" cy="30" rx="20" ry="10" class="usecase-ellipse" />
    <text x="220" y="34" class="legend-text">System Use Case</text>
  </g>
  
  <text x="1080" y="750" font-family="'Outfit', sans-serif" font-size="10px" fill="#94A3B8" text-anchor="end">Studvisor System Specification 3.1 &copy; 2026</text>
</svg>
