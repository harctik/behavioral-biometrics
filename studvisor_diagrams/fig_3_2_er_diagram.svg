  <g id="table-users" transform="translate(450, 110)">
    <rect width="220" height="160" class="table-border" />
    <path d="M 0,0 L 220,0 L 220,28 L 0,28 Z" class="table-header-users" />
    <text x="15" y="19" class="table-title">users</text>
    
    <!-- Columns -->
    <text x="15" y="45" class="column-name">user_id</text>
    <text x="120" y="45" class="column-type">INT</text>
    <text x="195" y="45" class="column-key">PK</text>
    
    <text x="15" y="62" class="column-name">username</text>
    <text x="120" y="62" class="column-type">VARCHAR</text>
    
    <text x="15" y="79" class="column-name">email</text>
    <text x="120" y="79" class="column-type">VARCHAR</text>
    
    <text x="15" y="96" class="column-name">password_hash</text>
    <text x="120" y="96" class="column-type">VARCHAR</text>
    
    <text x="15" y="113" class="column-name">role</text>
    <text x="120" y="113" class="column-type">ENUM</text>
    
    <text x="15" y="130" class="column-name">department_id</text>
    <text x="120" y="130" class="column-type">INT</text>
    
    <text x="15" y="147" class="column-name">is_active</text>
    <text x="120" y="147" class="column-type">BOOLEAN</text>
  </g>

