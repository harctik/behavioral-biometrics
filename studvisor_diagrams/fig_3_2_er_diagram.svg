    <text x="195" y="45" class="column-key">PK</text>
    
    <text x="15" y="62" class="column-name">student_id</text>
    <text x="120" y="62" class="column-type">INT</text>
    <text x="195" y="62" class="column-fk">FK</text>
    
    <text x="15" y="79" class="column-name">subject_id</text>
