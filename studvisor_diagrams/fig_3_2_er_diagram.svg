  <g id="table-marks" transform="translate(300, 360)">
    <rect width="220" height="160" class="table-border" />
    <path d="M 0,0 L 220,0 L 220,28 L 0,28 Z" class="table-header-academic" />
    <text x="15" y="19" class="table-title">marks</text>
    
    <text x="15" y="45" class="column-name">mark_id</text>
