  <!-- ==================== DIAGRAM LEGEND ==================== -->
  <g transform="translate(480, 630)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8" />
    <text x="15" y="20" font-family="'Outfit', sans-serif" font-weight="600" font-size="11px" fill="#0F172A">SCHEMA CATEGORIES</text>
    
    <rect x="15" y="32" width="12" height="12" fill="#1E3A8A" rx="2" />
    <text x="35" y="42" font-family="'Outfit', sans-serif" font-size="10px" fill="#475569">Core RBAC Identity</text>
    
    <rect x="15" y="49" width="12" height="12" fill="#0F766E" rx="2" />
