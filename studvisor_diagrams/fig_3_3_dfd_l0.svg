<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #64748B; text-anchor: middle; }
      
      /* DFD shapes */
      .central-process { fill: url(#proc-grad); stroke: #0D9488; stroke-width: 2.5; filter: drop-shadow(0 10px 15px rgba(13, 148, 136, 0.15)); }
      .external-entity { fill: #FFFFFF; stroke: #334155; stroke-width: 2; rx: 8; filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.08)); }
      
      .entity-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; fill: #0F172A; text-anchor: middle; }
      .process-num { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; fill: #0F766E; text-anchor: middle; }
      .process-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 15px; fill: #0F172A; text-anchor: middle; }
      
      /* Data Flows */
      .flow-line { fill: none; stroke: #64748B; stroke-width: 1.5; stroke-linecap: round; }
      .flow-arrow { fill: #64748B; }
      .flow-label { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #334155; font-weight: 500; }
    ]]></style>
    
    <linearGradient id="proc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="1120" height="792" fill="#F8FAFC" />
  
  <!-- Titles -->
  <text x="560" y="50" class="title">FIGURE 3.3: DFD LEVEL 0 (CONTEXT DIAGRAM)</text>
  <text x="560" y="72" class="subtitle">System Boundaries, External Entities, and High-Level Bidirectional Data Flows</text>

  <!-- Central Process: 0.0 Studvisor Platform -->
  <g id="center-process" transform="translate(560, 396)">
    <circle r="110" class="central-process" />
    <!-- Horizontal divide -->
    <line x1="-110" y1="-25" x2="110" y2="-25" stroke="#0D9488" stroke-width="1.5" />
    <line x1="-106" y1="25" x2="106" y2="25" stroke="#0D9488" stroke-width="1.5" />
    <text x="0" y="-50" class="process-num">0.0</text>
    <text x="0" y="2" class="process-title">STUDVISOR</text>
    <text x="0" y="18" class="process-title">PLATFORM</text>
    <text x="0" y="55" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#0D9488" font-weight="600" text-anchor="middle">CENTRAL ORCHESTRATOR</text>
  </g>

  <!-- External Entity 1: Student (Left) -->
  <g id="entity-student" transform="translate(60, 346)">
    <rect width="180" height="100" class="external-entity" />
    <rect width="180" height="8" fill="#F59E0B" rx="2" />
    <text x="90" y="54" class="entity-title">STUDENT</text>
    <text x="90" y="72" font-family="'Outfit', sans-serif" font-size="10px" fill="#64748B" text-anchor="middle">Enrolled Academic User</text>
  </g>

  <!-- External Entity 2: Faculty Member (Top) -->
  <g id="entity-faculty" transform="translate(470, 40)">
    <rect width="180" height="100" class="external-entity" />
    <rect width="180" height="8" fill="#3B82F6" rx="2" />
    <text x="90" y="54" class="entity-title">FACULTY MEMBER</text>
    <text x="90" y="72" font-family="'Outfit', sans-serif" font-size="10px" fill="#64748B" text-anchor="middle">Auditor / Leave Approver</text>
  </g>

  <!-- External Entity 3: Administrator (Bottom) -->
  <g id="entity-admin" transform="translate(470, 650)">
    <rect width="180" height="100" class="external-entity" />
    <rect width="180" height="8" fill="#EF4444" rx="2" />
    <text x="90" y="54" class="entity-title">ADMINISTRATOR</text>
    <text x="90" y="72" font-family="'Outfit', sans-serif" font-size="10px" fill="#64748B" text-anchor="middle">System / Model Auditor</text>
  </g>

  <!-- External Entity 4: External AI Provider (Right) -->
  <g id="entity-ai" transform="translate(880, 346)">
    <rect width="180" height="100" class="external-entity" />
    <rect width="180" height="8" fill="#8B5CF6" rx="2" />
    <text x="90" y="54" class="entity-title">EXTERNAL AI PROVIDER</text>
    <text x="90" y="72" font-family="'Outfit', sans-serif" font-size="10px" fill="#64748B" text-anchor="middle">Anthropic / OpenAI API</text>
  </g>


  <!-- ==================== FLOWS (STUDENT <-> CENTRAL SYSTEM) ==================== -->
  
  <!-- Student -> Central (Top Inbound) -->
  <path d="M 240,366 C 300,340 330,320 450,320" class="flow-line" marker-end="url(#arrow)" />
  <text x="320" y="310" class="flow-label">1. Credentials &amp; Auth Request</text>
  <text x="320" y="334" class="flow-label">2. Academic Concept Queries</text>
  
  <!-- Student -> Central (Bottom Inbound) -->
  <path d="M 240,426 C 290,450 330,460 450,460" class="flow-line" marker-end="url(#arrow)" />
  <text x="310" y="480" class="flow-label">3. Leave Request &amp; Wall Posts</text>

  <!-- Central -> Student (Top Outbound) -->
  <path d="M 450,350 C 370,360 330,380 248,390" class="flow-line" marker-end="url(#arrow)" />
  <text x="300" y="375" class="flow-label">4. Real-time Attendance &amp; Marks</text>

  <!-- Central -> Student (Bottom Outbound) -->
  <path d="M 450,430 C 370,420 310,410 248,406" class="flow-line" marker-end="url(#arrow)" />
  <text x="300" y="445" class="flow-label">5. AI Tutor Stream (SSE) &amp; Wall Feed</text>


  <!-- ==================== FLOWS (FACULTY <-> CENTRAL SYSTEM) ==================== -->
  
  <!-- Faculty -> Central (Left Inbound) -->
  <path d="M 520,140 L 520,286" class="flow-line" marker-end="url(#arrow)" />
  <text x="400" y="210" class="flow-label" text-anchor="end">1. Timetable Configurations</text>
  <text x="400" y="230" class="flow-label" text-anchor="end">2. Attendance &amp; Marks inputs</text>

  <!-- Central -> Faculty (Right Outbound) -->
  <path d="M 600,286 L 600,140" class="flow-line" marker-end="url(#arrow)" />
  <text x="610" y="210" class="flow-label" text-anchor="start">3. Class Performance Reports</text>
  <text x="610" y="230" class="flow-label" text-anchor="start">4. Student Predictive Risk Signals</text>


  <!-- ==================== FLOWS (ADMIN <-> CENTRAL SYSTEM) ==================== -->
  
  <!-- Admin -> Central (Left Inbound) -->
  <path d="M 520,650 L 520,506" class="flow-line" marker-end="url(#arrow)" />
  <text x="400" y="580" class="flow-label" text-anchor="end">1. Master Configuration Data</text>
  <text x="400" y="600" class="flow-label" text-anchor="end">2. AI Parameters &amp; Guard Rules</text>

  <!-- Central -> Admin (Right Outbound) -->
  <path d="M 600,506 L 600,650" class="flow-line" marker-end="url(#arrow)" />
  <text x="610" y="580" class="flow-label" text-anchor="start">3. Append-only Audit Log Exports</text>
  <text x="610" y="600" class="flow-label" text-anchor="start">4. Cohort Analytics Heatmaps</text>


  <!-- ==================== FLOWS (EXTERNAL AI <-> CENTRAL SYSTEM) ==================== -->
  
  <!-- Central -> AI (Top Outbound) -->
  <path d="M 670,366 C 730,330 810,330 872,356" class="flow-line" marker-end="url(#arrow)" />
  <text x="710" y="325" class="flow-label">1. Sanitised RAG Prompt Payload</text>

  <!-- AI -> Central (Bottom Inbound) -->
  <path d="M 880,416 C 810,450 740,450 678,426" class="flow-line" marker-end="url(#arrow)" />
  <text x="730" y="475" class="flow-label">2. Generated Response Token Stream</text>
  
  <text x="1080" y="750" font-family="'Outfit', sans-serif" font-size="10px" fill="#94A3B8" text-anchor="end">Studvisor Data Flow Architecture L0 &copy; 2026</text>
</svg>
