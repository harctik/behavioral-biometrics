<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #64748B; text-anchor: middle; }
      
      /* Shapes */
      .process-circle { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; filter: drop-shadow(0 4px 6px rgba(22, 163, 74, 0.08)); }
      .process-text { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 10px; fill: #1E293B; text-anchor: middle; }
      .process-num { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; fill: #15803D; text-anchor: middle; }
      
      .entity-box { fill: #FFFFFF; stroke: #334155; stroke-width: 2; rx: 6; }
      .entity-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 11px; fill: #0F172A; text-anchor: middle; }
      
      .store-line { stroke: #0284C7; stroke-width: 2.5; }
      .store-bg { fill: #F0F9FF; }
      .store-text { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 10px; fill: #0369A1; }
      
      /* Connectors */
      .flow-line { fill: none; stroke: #475569; stroke-width: 1.2; }
      .flow-label { font-family: 'Outfit', sans-serif; font-size: 8.5px; fill: #334155; }
    ]]></style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1120" height="792" fill="#F8FAFC" />
  
  <!-- Titles -->
  <text x="560" y="50" class="title">FIGURE 3.4: DFD LEVEL 1 (MAJOR BACKEND FLOWS)</text>
  <text x="560" y="72" class="subtitle">Modular Process Flows (P1 - P7), Inputs, Outputs, and Data Stores Intersections</text>

  <!-- ==================== ENTITIES ==================== -->
  <!-- Student (Left) -->
  <g id="ent-student" transform="translate(40, 320)">
    <rect width="120" height="80" class="entity-box" />
    <rect width="120" height="6" fill="#F59E0B" rx="1.5" />
    <text x="60" y="45" class="entity-title">STUDENT</text>
  </g>
  
  <!-- Faculty (Right Top) -->
  <g id="ent-faculty" transform="translate(960, 160)">
    <rect width="120" height="80" class="entity-box" />
    <rect width="120" height="6" fill="#3B82F6" rx="1.5" />
    <text x="60" y="45" class="entity-title">FACULTY MEMBER</text>
  </g>

  <!-- Admin (Right Bottom) -->
  <g id="ent-admin" transform="translate(960, 480)">
    <rect width="120" height="80" class="entity-box" />
    <rect width="120" height="6" fill="#EF4444" rx="1.5" />
    <text x="60" y="45" class="entity-title">ADMINISTRATOR</text>
  </g>


  <!-- ==================== DATA STORES ==================== -->
  <!-- D1: Academic DB -->
  <g id="store-d1" transform="translate(360, 240)">
    <rect width="140" height="35" class="store-bg" opacity="0.8" />
    <line x1="0" y1="0" x2="140" y2="0" class="store-line" />
    <line x1="0" y1="35" x2="140" y2="35" class="store-line" />
    <text x="15" y="21" class="store-text">D1: Academic Database</text>
  </g>

  <!-- D2: Campus Wall DB -->
  <g id="store-d2" transform="translate(620, 240)">
    <rect width="140" height="35" class="store-bg" opacity="0.8" />
    <line x1="0" y1="0" x2="140" y2="0" class="store-line" />
    <line x1="0" y1="35" x2="140" y2="35" class="store-line" />
    <text x="15" y="21" class="store-text">D2: Campus Wall DB</text>
  </g>

  <!-- D3: Risk Signals Table -->
  <g id="store-d3" transform="translate(360, 480)">
    <rect width="140" height="35" class="store-bg" opacity="0.8" />
    <line x1="0" y1="0" x2="140" y2="0" class="store-line" />
    <line x1="0" y1="35" x2="140" y2="35" class="store-line" />
    <text x="15" y="21" class="store-text">D3: Risk Signals DB</text>
  </g>

  <!-- D4: Merit Logs Table -->
  <g id="store-d4" transform="translate(620, 480)">
    <rect width="140" height="35" class="store-bg" opacity="0.8" />
    <line x1="0" y1="0" x2="140" y2="0" class="store-line" />
    <line x1="0" y1="35" x2="140" y2="35" class="store-line" />
    <text x="15" y="21" class="store-text">D4: Merit/XP Database</text>
  </g>

  <!-- D5: Audit Logs DB -->
  <g id="store-d5" transform="translate(480, 680)">
    <rect width="160" height="35" class="store-bg" opacity="0.8" />
    <line x1="0" y1="0" x2="160" y2="0" class="store-line" stroke="#85144b"/>
    <line x1="0" y1="35" x2="160" y2="35" class="store-line" stroke="#85144b"/>
    <text x="15" y="21" class="store-text" fill="#85144b">D5: Immutable Audit Logs</text>
  </g>


  <!-- ==================== PROCESSES ==================== -->
  
  <!-- P1: User Authentication -->
  <g id="proc-p1" transform="translate(250, 150)">
    <circle r="40" class="process-circle" />
    <text x="0" y="-12" class="process-num">P1</text>
    <text x="0" y="4" class="process-text">User</text>
    <text x="0" y="16" class="process-text">Authentication</text>
  </g>

  <!-- P2: Academic Data Management -->
  <g id="proc-p2" transform="translate(560, 120)">
    <circle r="40" class="process-circle" />
    <text x="0" y="-12" class="process-num">P2</text>
    <text x="0" y="4" class="process-text">Academic Data</text>
    <text x="0" y="16" class="process-text">Management</text>
  </g>

  <!-- P3: AI Tutor Interaction -->
  <g id="proc-p3" transform="translate(860, 150)">
    <circle r="40" class="process-circle" />
    <text x="0" y="-12" class="process-num">P3</text>
    <text x="0" y="4" class="process-text">AI Tutor</text>
    <text x="0" y="16" class="process-text">Interaction</text>
  </g>

  <!-- P4: Predictive Risk Computation -->
  <g id="proc-p4" transform="translate(250, 390)">
    <circle r="40" class="process-circle" />
    <text x="0" y="-12" class="process-num">P4</text>
    <text x="0" y="4" class="process-text">Predictive Risk</text>
    <text x="0" y="16" class="process-text">Computation</text>
  </g>

  <!-- P5: Campus Wall Processing -->
  <g id="proc-p5" transform="translate(560, 380)">
    <circle r="40" class="process-circle" />
    <text x="0" y="-12" class="process-num">P5</text>
    <text x="0" y="4" class="process-text">Campus Wall</text>
    <text x="0" y="16" class="process-text">Processing</text>
  </g>

  <!-- P6: Merit & Gamification -->
  <g id="proc-p6" transform="translate(860, 390)">
    <circle r="40" class="process-circle" />
    <text x="0" y="-12" class="process-num">P6</text>
    <text x="0" y="4" class="process-text">Merit &amp;</text>
    <text x="0" y="16" class="process-text">Gamification</text>
  </g>

  <!-- P7: Audit & Compliance -->
  <g id="proc-p7" transform="translate(560, 580)">
    <circle r="40" class="process-circle" stroke="#85144b" fill="#FFF0F5" />
    <text x="0" y="-12" class="process-num" fill="#85144b">P7</text>
    <text x="0" y="4" class="process-text">Audit &amp;</text>
    <text x="0" y="16" class="process-text">Compliance</text>
  </g>


  <!-- ==================== FLOW LINES ==================== -->
  
  <!-- Student -> P1 (Auth) -->
  <path d="M 160,340 C 180,310 190,260 220,180" class="flow-line" marker-end="url(#arrow)" />
  <text x="160" y="270" class="flow-label">User Credentials</text>
  
  <!-- P1 -> Student (Auth response) -->
  <path d="M 230,190 C 210,260 190,320 160,350" class="flow-line" marker-end="url(#arrow)" />
  <text x="210" y="300" class="flow-label">JWT Tokens</text>

  <!-- Faculty -> P2 (Marks/Attendance) -->
  <path d="M 960,190 L 600,130" class="flow-line" marker-end="url(#arrow)" />
  <text x="750" y="150" class="flow-label">Attendance &amp; Marks inputs</text>

  <!-- P2 -> D1 (Academic DB) -->
  <path d="M 520,130 C 470,140 450,180 430,240" class="flow-line" marker-end="url(#arrow)" />
  <text x="430" y="160" class="flow-label">Write Academic logs</text>

  <!-- Student -> P3 (AI) -->
  <path d="M 160,360 C 350,390 600,320 820,175" class="flow-line" marker-end="url(#arrow)" />
  <text x="480" y="360" class="flow-label">Student query</text>

  <!-- P3 -> Student (AI Response Stream) -->
  <path d="M 830,180 C 650,300 450,370 160,370" class="flow-line" marker-end="url(#arrow)" />
  <text x="490" y="335" class="flow-label">SSE token stream</text>

  <!-- D1 -> P3 (RAG Context) -->
  <path d="M 460,275 C 560,300 760,250 828,185" class="flow-line" marker-end="url(#arrow)" />
  <text x="640" y="290" class="flow-label">Academic Profile Context</text>

  <!-- D1 -> P4 (Risk Engine) -->
  <path d="M 400,275 C 380,310 320,350 285,372" class="flow-line" marker-end="url(#arrow)" />
  <text x="300" y="330" class="flow-label">Student trends</text>

  <!-- P4 -> D3 (Write risk signals) -->
  <path d="M 285,415 C 310,430 360,460 400,480" class="flow-line" marker-end="url(#arrow)" />
  <text x="310" y="455" class="flow-label">Risk metrics</text>

  <!-- D3 -> Faculty (Risk warnings) -->
  <path d="M 500,498 C 650,500 850,450 960,230" class="flow-line" marker-end="url(#arrow)" />
  <text x="750" y="470" class="flow-label">At-risk flags</text>

  <!-- Student -> P5 (Wall Post) -->
  <path d="M 160,380 C 260,400 420,390 520,385" class="flow-line" marker-end="url(#arrow)" />
  <text x="320" y="405" class="flow-label">Anonymous Wall post</text>

  <!-- P5 -> D2 (Write HMAC post) -->
  <path d="M 580,380 C 600,370 650,330 670,275" class="flow-line" marker-end="url(#arrow)" />
  <text x="640" y="340" class="flow-label">Hashed content</text>

  <!-- P5 -> Admin (Escalations) -->
  <path d="M 580,410 C 660,450 820,490 960,505" class="flow-line" marker-end="url(#arrow)" />
  <text x="720" y="450" class="flow-label">Grievance alerts</text>

  <!-- P2 -> P6 (Trigger Gamification) -->
  <path d="M 600,120 C 720,120 840,250 860,350" class="flow-line" marker-end="url(#arrow)" />
  <text x="760" y="210" class="flow-label">Academic actions</text>

  <!-- P6 -> D4 (Write XP) -->
  <path d="M 830,415 C 800,430 760,460 720,480" class="flow-line" marker-end="url(#arrow)" />
  <text x="770" y="455" class="flow-label">Award XP / Badges</text>

  <!-- D4 -> Student (Leaderboard) -->
  <path d="M 690,515 C 600,550 350,520 160,390" class="flow-line" marker-end="url(#arrow)" />
  <text x="350" y="520" class="flow-label">Merit badges &amp; ranks</text>

  <!-- State-changing flows -> P7 (Audit logs interceptor) -->
  <path d="M 290,150 C 350,150 450,450 528,555" class="flow-line" stroke-dasharray="2 2" marker-end="url(#arrow)" />
  <path d="M 520,120 C 480,90 480,500 520,560" class="flow-line" stroke-dasharray="2 2" marker-end="url(#arrow)" />
  <path d="M 560,420 L 560,540" class="flow-line" stroke-dasharray="2 2" marker-end="url(#arrow)" />
  <text x="460" y="550" class="flow-label">State-change triggers</text>

  <!-- P7 -> D5 (Audit DB Write) -->
  <path d="M 560,620 L 560,680" class="flow-line" stroke="#85144b" marker-end="url(#arrow)" />
  <text x="568" y="650" class="flow-label" fill="#85144b">Append-only event record</text>

  <text x="1080" y="750" font-family="'Outfit', sans-serif" font-size="10px" fill="#94A3B8" text-anchor="end">Studvisor Data Flow Architecture L1 &copy; 2026</text>
</svg>
