<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
      
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #64748B; text-anchor: middle; }
      
      /* Swimlanes */
      .lane-line { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .lane-header { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; fill: #475569; letter-spacing: 1px; }
      
      /* Flow Boxes */
      .step-rect { fill: #FFFFFF; stroke: #0284C7; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 4px 6px rgba(2, 132, 199, 0.08)); }
      .step-rect-security { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 4px 6px rgba(239, 68, 68, 0.08)); }
      .step-rect-db { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 4px 6px rgba(16, 185, 129, 0.08)); }
      
      .step-num { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; fill: #0284C7; }
      .step-num-sec { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; fill: #EF4444; }
      .step-num-db { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; fill: #10B981; }
      
      .step-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 11px; fill: #0F172A; }
      .step-desc { font-family: 'Outfit', sans-serif; font-size: 9.5px; fill: #475569; }
      
      /* Connector lines */
      .flow-line { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; }
      .flow-label { font-family: 'Outfit', sans-serif; font-size: 9px; fill: #334155; }
    ]]></style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1120" height="792" fill="#F8FAFC" />
  
  <!-- Titles -->
  <text x="560" y="50" class="title">FIGURE 3.6: SYSTEM FLOW DIAGRAM (SFD)</text>
  <text x="560" y="72" class="subtitle">Request Life Cycle: Swimlane Walkthrough of Ingress, JWT Verification, DB Scoping, Transactions, and Audit trail</text>

  <!-- ==================== SWIMLANES ==================== -->
  
  <!-- Swimlane Headers -->
  <text x="140" y="115" class="lane-header" text-anchor="middle">1. CLIENT PORTAL</text>
  <text x="410" y="115" class="lane-header" text-anchor="middle">2. SECURITY &amp; MIDDLEWARE</text>
  <text x="680" y="115" class="lane-header" text-anchor="middle">3. APPLICATION SERVICES</text>
  <text x="950" y="115" class="lane-header" text-anchor="middle">4. PERSISTENCE &amp; COMPLIANCE</text>

  <!-- Lane Dividers -->
  <line x1="280" y1="90" x2="280" y2="720" class="lane-line" />
  <line x1="540" y1="90" x2="540" y2="720" class="lane-line" />
  <line x1="820" y1="90" x2="820" y2="720" class="lane-line" />


  <!-- ==================== FLOW BLOCKS ==================== -->
  
  <!-- Client Browser Start -->
  <g transform="translate(40, 140)">
    <rect width="200" height="60" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" rx="6" />
    <text x="15" y="25" font-family="'Outfit', sans-serif" font-weight="600" font-size="12px" fill="#0F172A">Client Browser (React App)</text>
    <text x="15" y="42" font-family="'Outfit', sans-serif" font-size="9.5px" fill="#475569">Initiates API Request (JWT Token)</text>
  </g>

  <!-- Step 1: Ingress and TLS Termination -->
  <g transform="translate(310, 140)">
    <rect width="200" height="70" class="step-rect-security" />
    <text x="15" y="22" class="step-num-sec">01</text>
    <text x="40" y="22" class="step-title">Ingress &amp; TLS Termination</text>
    <text x="15" y="42" class="step-desc">SlowAPI verifies rate limits</text>
    <text x="15" y="55" class="step-desc">(&lt; 200 req/min per IP)</text>
  </g>

  <!-- Step 2: JWT Verification -->
  <g transform="translate(310, 240)">
    <rect width="200" height="70" class="step-rect-security" />
    <text x="15" y="22" class="step-num-sec">02</text>
    <text x="40" y="22" class="step-title">JWT Claims Verification</text>
    <text x="15" y="42" class="step-desc">security.py extracts claims &amp;</text>
    <text x="15" y="55" class="step-desc">verifies token signature/expiry</text>
  </g>

  <!-- Step 3: Role Guard -->
  <g transform="translate(310, 340)">
    <rect width="200" height="70" class="step-rect-security" />
    <text x="15" y="22" class="step-num-sec">03</text>
    <text x="40" y="22" class="step-title">Role-Based Access Guard</text>
    <text x="15" y="42" class="step-desc">Verifies endpoint permissions</text>
    <text x="15" y="55" class="step-desc">(Student, Faculty, or Admin)</text>
  </g>

  <!-- Step 4: Database Scoping -->
  <g transform="translate(580, 340)">
    <rect width="200" height="70" class="step-rect" />
    <text x="15" y="22" class="step-num">04</text>
    <text x="40" y="22" class="step-title">Database Scoping Helper</text>
    <text x="15" y="42" class="step-desc">Appends scope filters (WHERE)</text>
    <text x="15" y="55" class="step-desc">to restrict data access to peer</text>
  </g>

  <!-- Step 5: Domain Router Dispatch -->
  <g transform="translate(580, 240)">
    <rect width="200" height="70" class="step-rect" />
    <text x="15" y="22" class="step-num">05</text>
    <text x="40" y="22" class="step-title">Domain Router Dispatch</text>
    <text x="15" y="42" class="step-desc">FastAPI dispatches request to</text>
    <text x="15" y="55" class="step-desc">domain-specific endpoint</text>
  </g>

  <!-- Step 6: Service Layer Execution -->
  <g transform="translate(580, 140)">
    <rect width="200" height="70" class="step-rect" />
    <text x="15" y="22" class="step-num">06</text>
    <text x="40" y="22" class="step-title">Service Layer Execution</text>
    <text x="15" y="42" class="step-desc">Business logic executed inside</text>
    <text x="15" y="55" class="step-desc">specialised domain services</text>
  </g>

  <!-- Step 7: Database Transaction -->
  <g transform="translate(850, 140)">
    <rect width="200" height="70" class="step-rect-db" />
    <text x="15" y="22" class="step-num-db">07</text>
    <text x="40" y="22" class="step-title">Database Transaction</text>
    <text x="15" y="42" class="step-desc">SQLAlchemy session session.commit()</text>
    <text x="15" y="55" class="step-desc">committed or automatically rolled back</text>
  </g>

  <!-- Step 8: Audit Logging -->
  <g transform="translate(850, 340)">
    <rect width="200" height="70" class="step-rect-db" />
    <text x="15" y="22" class="step-num-db">08</text>
    <text x="40" y="22" class="step-title">Audit Trail Logging</text>
    <text x="15" y="42" class="step-desc">AuditLogMiddleware writes event</text>
    <text x="15" y="55" class="step-desc">diff to D5: Immutable DB table</text>
  </g>

  <!-- Step 9: Serialised Response -->
  <g transform="translate(40, 580)">
    <rect width="200" height="70" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" rx="6" />
    <text x="15" y="22" font-family="'Outfit', sans-serif" font-weight="800" font-size="12px" fill="#475569">09</text>
    <text x="40" y="22" font-family="'Outfit', sans-serif" font-weight="600" font-size="11px" fill="#0F172A">Serialised Response</text>
    <text x="15" y="42" class="step-desc">Pydantic models filter outbound</text>
    <text x="15" y="55" class="step-desc">data, returning 200 OK to Client</text>
  </g>


  <!-- ==================== PATH CONNECTORS ==================== -->
  <g id="lifecycle-connectors">
    <!-- Client -> Step 1 (Request) -->
    <path d="M 240,170 L 310,170" class="flow-line" marker-end="url(#arrow)" />
    <text x="250" y="162" class="flow-label">HTTPS Post</text>
    
    <!-- Step 1 -> Step 2 -->
    <path d="M 410,210 L 410,240" class="flow-line" marker-end="url(#arrow)" />
    <text x="415" y="228" class="flow-label">Success</text>

    <!-- Step 2 -> Step 3 -->
    <path d="M 410,310 L 410,340" class="flow-line" marker-end="url(#arrow)" />
    <text x="415" y="328" class="flow-label">Valid JWT</text>

    <!-- Step 3 -> Step 4 -->
    <path d="M 510,375 L 580,375" class="flow-line" marker-end="url(#arrow)" />
    <text x="518" y="368" class="flow-label">Authorised</text>

    <!-- Step 4 -> Step 5 -->
    <path d="M 680,340 L 680,310" class="flow-line" marker-end="url(#arrow)" />
    <text x="685" y="328" class="flow-label">Scoped DB</text>

    <!-- Step 5 -> Step 6 -->
    <path d="M 680,240 L 680,210" class="flow-line" marker-end="url(#arrow)" />
    <text x="685" y="228" class="flow-label">Routed</text>

    <!-- Step 6 -> Step 7 -->
    <path d="M 780,175 L 850,175" class="flow-line" marker-end="url(#arrow)" />
    <text x="790" y="168" class="flow-label">Execute</text>

    <!-- Step 7 -> Step 8 -->
    <path d="M 950,210 L 950,340" class="flow-line" marker-end="url(#arrow)" />
    <text x="955" y="280" class="flow-label">Commit Transaction</text>

    <!-- Step 8 -> Step 9 -->
    <path d="M 850,375 C 700,375 600,430 450,500 C 350,550 250,580 240,585" class="flow-line" marker-end="url(#arrow)" />
    <text x="600" y="440" class="flow-label">Response Intercept &amp; Audit Logged</text>
  </g>

  <!-- Error downdrafts (Indicated as security blocks) -->
  <!-- Let's add a dashed return path from Step 1 & 2 for bad queries -->
  <path d="M 310,185 C 260,200 240,240 240,280 C 240,350 220,530 180,580" class="flow-line" stroke="#EF4444" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="260" y="230" class="flow-label" fill="#EF4444">429 Rate Limit Exceeded</text>
  
  <path d="M 310,285 C 280,310 270,390 270,470 C 270,510 240,560 210,580" class="flow-line" stroke="#EF4444" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="280" y="460" class="flow-label" fill="#EF4444">401 Unauthorised Token</text>

  <text x="1080" y="750" font-family="'Outfit', sans-serif" font-size="10px" fill="#94A3B8" text-anchor="end">Studvisor Request Flow Middleware &copy; 2026</text>
</svg>
